name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require npm project files
        run: |
          test -f package.json || { echo "::error::package.json is required"; exit 1; }
          test -f package-lock.json || { echo "::error::package-lock.json is required"; exit 1; }
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
