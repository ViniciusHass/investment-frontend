name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository foundation
        id: project
        run: |
          test -f AGENTS.md
          test -f README.md
          if test -f package.json || test -f package-lock.json; then
            test -f package.json && test -f package-lock.json || { echo "::error::Both package.json and package-lock.json are required"; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::npm project files are pending; app checks will start when both files exist"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        if: steps.project.outputs.ready == 'true'
        run: npm ci
      - name: Lint
        if: steps.project.outputs.ready == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.project.outputs.ready == 'true'
        run: npm run typecheck
      - name: Build
        if: steps.project.outputs.ready == 'true'
        run: npm run build
